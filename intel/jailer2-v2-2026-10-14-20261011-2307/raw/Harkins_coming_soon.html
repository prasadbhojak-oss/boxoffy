imate yet explosive glimpse of an artist in complete command of his voice and stagecraft.\n\nA triumph in archival filmmaking, the film transforms footage assembled from a 14-camera shoot captured on 35mm film over two nights, into an extraordinary cinematic event. George Michael: The Faith Tour is a celebration of ambition and fearless artistry at its peak, and a moment when the then 24-year-old George Michael changed the course of his career. This global theatrical event invites audiences to rediscover the power and joy of George Michael in full flight.\n\nGeorge Michael: The Faith Tour will open with an original short film by Mary McCartney, titled ‘Finding Faith’, offering an intimate introduction contextualising the tour’s cultural significance, through a sensitive and cinematic lens. In George’s own words, the film features voiceover from an unheard interview alongside unseen images captured by legendary American photographer Herb Ritts, and behind-the-scenes footage of the Faith music video.\n\nAlongside the theatrical release, George Michael Entertainment and Sony Music Entertainment will release THE FAITH TOUR, an 18-track live album of previously unreleased recordings featuring hits from George Michael’s Wham! and solo catalogues. Recorded during his groundbreaking world tour, the album showcases George’s extraordinary vocal talent and skill as a live performer. More details on the album to come.\n\nGeorge Michael: The Faith Tour film will be released worldwide in theatres later this year. Additional details, including release dates and territories, will be announced soon.","duration":"1h 54m","genre":"Concert, Music","directedBy":["David Austin","Andrew Morahan"],"poster":"https://harkinsposters.imgix.net/HO00016342_poster?q=80\u0026auto=format,compress\u0026w=456","posterThumb":"https://harkinsposters.imgix.net/HO00016342_poster?q=80\u0026auto=format,compress\u0026w=228","banner":"https://cdn.harkins.com/cdn/media/entity/get/FilmAdvertising/HO00016342?al
