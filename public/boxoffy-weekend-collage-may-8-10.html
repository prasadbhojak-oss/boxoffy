  /* The actual collage canvas — 1200x675 for social/X (16:9) */

    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);

  /* Decorative diagonal lines pattern */
  #collage::before {
    content: "";

  /* Header overlay */

    right: 32px;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;

  .brand {
    color: #fff;

  .brand .logo-dot {

  .header-meta {

    font-size: 10px;

  /* Posters area — 4×3 grid for 12 films */

    position: absolute;
    top: 95px;
    left: 32px;

  .poster-cell {
    position: relative;
    border-radius: 6px;
    overflow: hidden;

  .poster-cell img {

  .poster-cell .placeholder {

    align-items: center;

    margin-top: 8px;
    letter-spacing: -0.01em;

  /* Signal badge top-left */

    top: 6px;
    left: 6px;
    background: rgba(0,0,0,0.85);
    color: #fff;

    border-radius: 3px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.04em;

  .signal-badge.fire { background: #EA580C; }
  .signal-badge.hold { background: #15803D; }
  .signal-badge.fade { background: #B45309; }
  .signal-badge.crash { background: #991B1B; }
  .signal-badge.new { background: #1E40AF; }
  .signal-badge.ott { background: #7C3AED; }

  /* Bottom info strip on each poster */
  .info-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.96) 0%, rgba(0,0,0,0.7) 55%, transparent 100%);

  .info-strip .film {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 2px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .info-strip .meta {
    color: rgba(255,255,255,0.7);
    font-size: 8.5px;
    font-weight: 500;

  .info-strip .num {

  .info-strip .num.muted { color: rgba(255,255,255,0.55); font-size: 11px; }

  /* Footer ribbon */

    bottom: 22px;

    right: 32px;
    display: flex;

    font-size: 11px;
  }
  .collage-footer .right {
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
  }
</style>

<script>

const TMDB_BEARER = "eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiI2YWM1OTY0NzEyZTA0NGRmMmJjMmFiYzFlMTFlZGMyYyIsIm5iZiI6MTc3Mzg4NTMxMS42MzIsInN1YiI6IjY5YmI1NzdmYjgyMzJhNzc5MjIxZWZjOCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.QxWkqL_4_3PfTnIVgcZYE0zlXQd9M2y5QL-oWNwq6dE";

const status = document.getElementById('status');

function showStatus(msg, type) {
  status.textContent = msg;
  status.className = 'status show' + (type ? ' ' + type : '');
}

async function fetchPoster(film) {
  try {
    const url = `https://api.themoviedb.org/3/search/multi?query=${encodeURIComponent(film.searchTitle)}&language=en-US&page=1`;
    const r = await fetch(url, {
      headers: {
        "Authorization": "Bearer " + TMDB_BEARER,
        "accept": "application/json"
      }
    });
    if (!r.ok) {
      console.warn(`TMDB ${r.status} for ${film.title}`);
      return null;
    }
    const data = await r.json();
    // Prefer movie or TV result with a year match if possible
    let hit = (data.results || []).find(m => 
      m.poster_path && (
        (m.release_date && m.release_date.startsWith(String(film.year))) ||
        (m.first_air_date && m.first_air_date.startsWith(String(film.year)))
      )
    );
    // Fallback: any result with poster_path
    if (!hit) {
      hit = (data.results || []).find(m => m.poster_path);
    }
    return hit ? `https://image.tmdb.org/t/p/w500${hit.poster_path}` : null;
  } catch (err) {
    console.error(`Failed to fetch ${film.title}:`, err);
    return null;
  }
}

async function loadPosters() {
  showStatus('🔍 Querying TMDB for 12 posters...', '');
  const grid = document.getElementById('posters-grid');
  grid.innerHTML = '';

  // Render placeholder cells first
  films.forEach((film, i) => {
    const cell = document.createElement('div');
    cell.className = 'poster-cell';
    const numClass = film.signalClass === 'fire' ? 'gold' : (film.signalClass === 'hold' ? 'green' : (film.signalClass === 'crash' ? 'muted' : ''));
    cell.innerHTML = `
      <div class="placeholder">
        <div>🎬</div>
        <div class="ph-title">${film.title}</div>
      </div>
      <div class="signal-badge ${film.signalClass}">${film.signal}</div>
      <div class="info-strip">
        <div class="meta">${film.lang}</div>
        <div class="film">${film.title}</div>
        <div class="num ${numClass}">${film.num}</div>
        <div class="meta" style="margin-top:2px">${film.cumul}</div>
      </div>
    `;
    cell.id = `cell-${i}`;
    grid.appendChild(cell);
  });

  // Fetch all posters in parallel
  const results = await Promise.all(films.map((f, i) => fetchPoster(f).then(url => ({film: f, idx: i, url}))));
  
  let hits = 0, misses = 0;
  results.forEach(({film, idx, url}) => {
    const cell = document.getElementById(`cell-${idx}`);
    if (url) {
      const img = document.createElement('img');
      img.src = url;
      img.alt = film.title;
      img.crossOrigin = "anonymous";
      img.onerror = () => {
        console.warn(`Image load failed for ${film.title}`);
      };
      const placeholder = cell.querySelector('.placeholder');
      if (placeholder) placeholder.replaceWith(img);
      hits++;
    } else {
      misses++;
    }
  });

  if (misses === 0) {
    showStatus(`✅ All ${hits} posters loaded from TMDB. Click "Download PNG" to save.`, 'success');
  } else if (hits > 0) {
    showStatus(`⚠ Loaded ${hits} of ${films.length} posters. ${misses} missing — placeholder shown for those.`, '');
  } else {
    showStatus(`❌ Could not load any posters. TMDB may be down or your network is blocking image.tmdb.org.`, 'error');
  }
}

async function downloadAsPNG() {
  showStatus('📸 Generating PNG (loading html2canvas)...', '');
  
  if (typeof html2canvas === 'undefined') {
    await new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }
  
  try {
    const canvas = await html2canvas(document.getElementById('collage'), {
      useCORS: true,
      allowTaint: false,
      backgroundColor: null,
      scale: 2,
      logging: false
    });
    
    canvas.toBlob(blob => {
      if (!blob) {
        showStatus('❌ PNG generation failed (blob empty). Try right-click → Save image.', 'error');
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `boxoffy-weekend-collage-may-8-10-2026.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showStatus('✅ Downloaded! Check your Downloads folder.', 'success');
    }, 'image/png');
  } catch (err) {
    showStatus(`❌ PNG export failed: ${err.message}. Try right-click the collage and "Save image as".`, 'error');
    console.error(err);
  }
}

// Auto-load on page open
window.addEventListener('DOMContentLoaded', () => {

</script>
